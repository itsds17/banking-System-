name: CI — Banking Decision Intelligence Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.9"

jobs:
  # ── Linting ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff linter
        run: ruff check src/ tests/ scripts/ api/

  # ── Unit Tests ───────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install a subset of deps needed for Phase 1 tests (fast, no heavy packages)
          pip install numpy pandas scipy scikit-learn xgboost \
                      faker pyyaml pyarrow pytest pytest-cov pytest-mock \
                      networkx statsmodels imbalanced-learn

      - name: Run Phase 1 data generation tests
        run: |
          pytest tests/test_data_generation.py -v --tb=short \
            --cov=src/data_generation --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          flags: data_generation
          fail_ci_if_error: false

  # ── Data Generator Smoke Test ─────────────────────────────────────────────────
  data-generator-smoke:
    name: Data Generator Smoke Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install numpy pandas scipy faker pyyaml pyarrow

      - name: Run generator with minimal config (500 customers, 5000 transactions)
        run: |
          python scripts/generate_data.py \
            --customers 500 \
            --transactions 5000 \
            --merchants 100 \
            --devices 200 \
            --format parquet \
            --log-level INFO

      - name: Verify output files exist
        run: |
          python -c "
          from pathlib import Path
          expected = ['customers.parquet', 'accounts.parquet', 'merchants.parquet',
                      'devices.parquet', 'transactions.parquet', 'loans.parquet',
                      'customer_devices.parquet', 'customer_ips.parquet', 'ip_addresses.parquet']
          out = Path('data/synthetic')
          missing = [f for f in expected if not (out / f).exists()]
          if missing:
              print(f'MISSING FILES: {missing}')
              exit(1)
          print('All output files verified.')
          "

      - name: Verify fraud labels are non-trivial
        run: |
          python -c "
          import pandas as pd
          df = pd.read_parquet('data/synthetic/transactions.parquet')
          fraud_rate = df['is_fraud'].mean()
          print(f'Fraud rate: {fraud_rate:.4f} ({df[\"is_fraud\"].sum()} / {len(df)})')
          assert fraud_rate > 0.001, f'Fraud rate too low: {fraud_rate}'
          print('Fraud label check PASSED')
          "

  # ── Docker Build Validation ───────────────────────────────────────────────────
  docker-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet

      - name: Verify init.sql exists for PostgreSQL
        run: test -f docker/postgres/init.sql && echo "init.sql found" || exit 1
